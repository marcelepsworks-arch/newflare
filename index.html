<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Newflare — Audio Reactive Visualizer (Prototype)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-dark">
    <header class="topbar">
      <div class="brand">Newflare</div>
      <div class="controls">
        <input id="fileInput" type="file" accept="audio/*,video/*" />
        <button id="captureTabBtn">Capture YouTube Tab</button>
        <button id="micBtn">Use Mic</button>
        <button id="startVisualBtn">Start Visual</button>
        <button id="recBtn" class="rec">REC</button>
        <a id="downloadLink" style="display:none">Download</a>
      </div>
    </header>

    <main class="stage">
      <canvas id="glCanvas"></canvas>
      <div id="audioHud">
        <span id="hudBeat" class="beat-dot"></span>
        <span id="hudBpm">— BPM</span>
        <div class="level-track"><div id="hudLevel" class="level-fill"></div></div>
      </div>
      <div id="overlayGui"></div>
      <div id="errorOverlay" style="display:none;position:fixed;left:12px;right:12px;top:80px;padding:12px;background:rgba(20,10,10,0.9);color:#fff;border-radius:8px;z-index:2000;max-height:40vh;overflow:auto;font-family:monospace;font-size:13px"></div>
    </main>

    <footer class="footer">Premium dark visualizer prototype — use a local server (http)</footer>
  </div>

  <script type="module" src="src/main.js"></script>
  <script>
    // Opening index.html directly (file://) blocks ES modules on CORS grounds, so main.js
    // never runs and every control silently does nothing. Say so instead of looking dead.
    (function(){
      var box = document.getElementById('errorOverlay');
      function fail(msg){ box.style.display = 'block'; box.innerHTML = msg; }

      if(location.protocol === 'file:'){
        fail('<strong>Cal obrir l\'app des d\'un servidor local.</strong><br><br>' +
             'Obrint el fitxer directament (file://) el navegador bloqueja els mòduls ES i cap control funciona.<br><br>' +
             'Al terminal, dins la carpeta del projecte:<br>' +
             '<code>node server.js</code><br>' +
             'i després obre <code>http://localhost:3000</code>');
        return;
      }
      // served over http but the module still never booted: report it rather than hang
      setTimeout(function(){
        if(!window.__NEWFLARE && box.style.display !== 'block'){
          fail('<strong>El mòdul principal no ha arrencat.</strong><br><br>' +
               'Obre la consola del navegador (F12) per veure l\'error. ' +
               'Si has editat el codi, potser hi ha un error de sintaxi a <code>src/</code>.');
        }
      }, 4000);
    })();
  </script>
</body>
</html>
